name: Build iOS Object Files

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-objects:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      LLVM_VERSION: "22.1.8"

    steps:
      - name: Show runner hardware info
        run: |
          echo "=== CPU Info ==="
          echo "Physical cores: $(sysctl -n hw.physicalcpu)"
          echo "Logical cores: $(sysctl -n hw.logicalcpu)"
          echo "CPU brand: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo 'Apple Silicon')"
          echo ""
          echo "=== Memory Info ==="
          echo "Total RAM: $(sysctl -n hw.memsize | awk '{print $0/1024/1024/1024 " GB"}')"
          echo ""
          echo "=== Disk Info ==="
          echo "Available disk space: $(df -h / | awk 'NR==2 {print $4}')"
          echo "Total disk size: $(df -h / | awk 'NR==2 {print $2}')"
          echo ""
          echo "=== OS Info ==="
          echo "macOS version: $(sw_vers -productVersion)"
          echo "Xcode version: $(xcodebuild -version | head -1)"
          echo ""
          echo "=== Architecture ==="
          echo "Arch: $(uname -m)"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get CMake 3.31.12
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.12

      - name: Install dependencies
        run: |
          brew install ninja lld

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Clone LLVM source code
        run: |
          git clone --depth 1 --branch release/22.x \
            https://github.com/llvm/llvm-project.git

      - name: Completely remove --gc-sections from LLVM CMake files
        run: |
          cd llvm-project/llvm/cmake/modules
          sed -i '' 's/-Wl,--gc-sections//g' AddLLVM.cmake
          sed -i '' 's/-Wl,--gc-sections//g' HandleLLVMOptions.cmake
          sed -i '' '/--gc-sections/d' AddLLVM.cmake
          sed -i '' '/--gc-sections/d' HandleLLVMOptions.cmake

      - name: Build iOS object files (arm64)
        run: |
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build/ios-arm64
          cd build/ios-arm64
          brew unlink zstd
          cmake -G Ninja ${{ github.workspace }}/llvm-project/llvm \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$SDKROOT \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="clang" \
            -DCMAKE_CXX_COMPILER="clang++" \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install_dummy \
            -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON \
            -DCMAKE_C_FLAGS="-O3 -mcpu=apple-a13" \
            -DCMAKE_CXX_FLAGS="-O3 -mcpu=apple-a13" \
            -DCMAKE_BUNDLE_DESTINATION="bin" \
            -DCMAKE_POLICY_DEFAULT_CMP0006=OLD \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_zstd=ON \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_BUILD_RUNTIME=On \
            -DLLVM_INCLUDE_TESTS=Off \
            -DLLVM_INCLUDE_EXAMPLES=Off \
            -DLLVM_ENABLE_BACKTRACES=Off \
            -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra;lld;flang" \
            -DLLVM_ENABLE_RUNTIMES="libc;libcxx;libcxxabi" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" \
            -DLLVM_INSTALL_UTILS=Off \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=Off \
            -DLLVM_ENABLE_INSTALL=Off \
            -DLLVM_TABLEGEN=${{ github.workspace }}/host/llvm-tblgen \
            -DCLANG_TABLEGEN=${{ github.workspace }}/host/clang-tblgen \
            -DMLIR_TABLEGEN_EXE=${{ github.workspace }}/host/mlir-tblgen \
            -DLLDB_TABLEGEN_EXE=${{ github.workspace }}/host/lldb-tblgen
          ninja -j 3 all-objects
          brew link zstd

      - name: Copy object files to repository objectives folder
        run: |
          mkdir -p ${{ github.workspace }}/objectives
          find build/ios-arm64 -name "*.o" -type f -exec cp {} ${{ github.workspace }}/objectives/ \;

      - name: Commit and push object files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${{ github.workspace }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add objectives/
          git diff --staged --quiet || git commit -m "Add iOS object files (LLVM ${{ env.LLVM_VERSION }})"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main