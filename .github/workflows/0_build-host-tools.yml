name: Build Host Tools Only

on:
  workflow_dispatch:

jobs:
  build-host-tools:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      LLVM_VERSION: "22.1.8"

    steps:
      - name: Show runner hardware info
        run: |
          echo "=== CPU Info ==="
          echo "Physical cores: $(sysctl -n hw.physicalcpu)"
          echo "Logical cores: $(sysctl -n hw.logicalcpu)"
          echo "CPU brand: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo 'Apple Silicon')"
          echo ""
          echo "=== Memory Info ==="
          echo "Total RAM: $(sysctl -n hw.memsize | awk '{print $0/1024/1024/1024 " GB"}')"
          echo ""
          echo "=== Disk Info ==="
          echo "Available disk space: $(df -h / | awk 'NR==2 {print $4}')"
          echo "Total disk size: $(df -h / | awk 'NR==2 {print $2}')"
          echo ""
          echo "=== OS Info ==="
          echo "macOS version: $(sw_vers -productVersion)"
          echo "Xcode version: $(xcodebuild -version | head -1)"
          echo ""
          echo "=== Architecture ==="
          echo "Arch: $(uname -m)"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get CMake 3.31.12
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.12

      - name: Install dependencies
        run: |
          brew install ninja lld

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Clone LLVM source code
        run: |
          git clone --depth 1 --branch release/22.x \
            https://github.com/llvm/llvm-project.git

      - name: Build host tools
        run: |
          mkdir -p build/host
          cd build/host
          cmake -G Ninja ${{ github.workspace }}/llvm-project/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" \
            -DLLVM_ENABLE_PROJECTS="clang;mlir;lldb;lld" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF
          ninja -j $(sysctl -n hw.logicalcpu) llvm-tblgen clang-tblgen mlir-tblgen lldb-tblgen

      - name: Copy host tools to repository host folder
        run: |
          mkdir -p ${{ github.workspace }}/host
          cp build/host/bin/llvm-tblgen ${{ github.workspace }}/host/
          cp build/host/bin/clang-tblgen ${{ github.workspace }}/host/
          cp build/host/bin/mlir-tblgen ${{ github.workspace }}/host/
          cp build/host/bin/lldb-tblgen ${{ github.workspace }}/host/

      - name: Commit and push host tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${{ github.workspace }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add host/
          git diff --staged --quiet || git commit -m "Update host tools (LLVM ${{ env.LLVM_VERSION }})"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
